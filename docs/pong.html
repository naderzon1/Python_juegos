<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Pong</title>
<link rel="stylesheet" href="estilo.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono-192.png">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="juego">
<header class="barra">
  <a href="index.html" aria-label="Volver al menú">⌂</a>
  <h1>Pong</h1>
  <button id="b-modo">1 jugador</button>
  <button id="b-nivel">Media</button>
  <button id="b-sonido" aria-label="Sonido">🔊</button>
  <button id="b-pausa" aria-label="Pausa">⏸</button>
  <button id="b-reiniciar" aria-label="Reiniciar">↻</button>
</header>
<div class="zona"><canvas id="lienzo"></canvas></div>
<p class="ayuda">Jugador 1: W / S (o flechas en modo 1 jugador) · Jugador 2: flechas · 1 / 2 / 3 dificultad · J cambiar jugadores · Espacio pausa · R reiniciar · M sonido · Con mando: palanca o cruceta, Start pausa</p>

<script src="comun.js"></script>
<script>
'use strict';
const ANCHO = 800, ALTO = 500, PALETA_W = 12, PALETA_H = 90, BOLA = 14, META = 7, VEL_USUARIO = 8;
const VEL_DEDO = 16; // la paleta sigue al dedo con esta velocidad máxima por paso
// dificultad: nombre, velocidad máxima de la IA, error de puntería en px
const DIFICULTAD = { 1: ['Fácil', 3.5, 45], 2: ['Media', 5.5, 25], 3: ['Difícil', 7.5, 8] };
const AZUL = '#4fc3f7', NARANJA = '#ff7043', LETRA = 'ui-monospace, Consolas, "Courier New", monospace';

Sonido.definir('paleta', (s) => { const p = []; s.tono(p, 0, 0.05, 520, 640, 0.3); return p; });
Sonido.definir('pared', (s) => { const p = []; s.tono(p, 0, 0.04, 300, null, 0.2, 'triangular'); return p; });
Sonido.definir('punto', (s) => { const p = []; s.tono(p, 0, 0.25, 500, 180, 0.25); return p; });
Sonido.definir('gana', (s) => {
  const p = []; s.melodia(p, [[72, 1], [76, 1], [79, 1], [84, 4]], 0.1, 0.25, 'cuadrada'); return p;
});
Sonido.definir('pierde', (s) => {
  const p = []; s.melodia(p, [[72, 2], [67, 2], [64, 2], [60, 4]], 0.14, 0.3, 'triangular'); return p;
});

const p = { estado: 'inicio', dos: Guardado.leer('pong_dos', false), nivel: Guardado.leer('pong_nivel', 2) };
const teclas = new Set();
const objetivo = { izq: null, der: null };  // altura a la que apunta el dedo de cada lado
const dedos = new Map();                     // id del dedo -> lado que controla

function reiniciar() {
  p.yIzq = p.yDer = (ALTO - PALETA_H) / 2;
  p.pIzq = p.pDer = 0;
  p.pausa = false;
  p.fin = false;
  p.tAyuda = 3;
  sacar(Math.random() < 0.5 ? -1 : 1);
}

function sacar(direccion) {
  p.bx = ANCHO / 2;
  p.by = ALTO / 2;
  p.vx = 5 * direccion;
  p.vy = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 2);
  p.objetivoIA = ALTO / 2;
  p.espera = 40; // pasos de pausa antes de mover la bola
}

function moverHumano(lado, arriba, abajo, m) {
  const clave = lado === 'izq' ? 'yIzq' : 'yDer';
  if (arriba.some((k) => teclas.has(k))) p[clave] -= VEL_USUARIO;
  if (abajo.some((k) => teclas.has(k))) p[clave] += VEL_USUARIO;
  if (m) { // mando: palanca (proporcional) o cruceta; con la cancha girada se mueve a los lados
    const eje = vertical ? m.ejeX : m.ejeY;
    const cruceta = vertical ? (m.ahora.der ? 1 : m.ahora.izq ? -1 : 0) : (m.ahora.abajo ? 1 : m.ahora.arriba ? -1 : 0);
    p[clave] += (eje || cruceta) * VEL_USUARIO * 1.2;
  }
  if (objetivo[lado] !== null) {
    const dif = objetivo[lado] - PALETA_H / 2 - p[clave];
    p[clave] += Math.max(-VEL_DEDO, Math.min(VEL_DEDO, dif));
  }
  p[clave] = Math.max(0, Math.min(ALTO - PALETA_H, p[clave]));
}

function moverIA() {
  const [, vmax, error] = DIFICULTAD[p.nivel];
  // solo reacciona cuando la bola viene hacia ella; si no, vuelve al centro
  if (p.vx > 0) {
    if (Math.random() < 0.05) p.objetivoIA = p.by + (Math.random() * 2 - 1) * error;
  } else {
    p.objetivoIA = ALTO / 2;
  }
  const dif = p.objetivoIA - (p.yDer + PALETA_H / 2);
  if (Math.abs(dif) > 4) p.yDer += Math.max(-vmax, Math.min(vmax, dif));
  p.yDer = Math.max(0, Math.min(ALTO - PALETA_H, p.yDer));
}

function moverBola() {
  if (p.espera > 0) { p.espera--; return; }
  p.bx += p.vx;
  p.by += p.vy;
  if (p.by <= 0 || p.by + BOLA >= ALTO) {
    p.vy = -p.vy;
    p.by = Math.max(0, Math.min(ALTO - BOLA, p.by));
    Sonido.tocar('pared');
  }
  if (p.vx < 0 && p.bx >= 20 && p.bx <= 20 + PALETA_W && p.by >= p.yIzq - BOLA && p.by <= p.yIzq + PALETA_H) {
    rebote(p.yIzq, 20 + PALETA_W, 1);
  }
  const xd = ANCHO - 20 - PALETA_W;
  if (p.vx > 0 && p.bx >= xd - BOLA && p.bx <= xd && p.by >= p.yDer - BOLA && p.by <= p.yDer + PALETA_H) {
    rebote(p.yDer, xd - BOLA, -1);
  }
  if (p.bx < -BOLA) { p.pDer++; punto(-1); }
  else if (p.bx > ANCHO) { p.pIzq++; punto(1); }
}

// el punto de impacto en la paleta define el ángulo
function rebote(yPaleta, xNueva, signo) {
  p.bx = xNueva;
  const rel = Math.max(-1, Math.min(1, (p.by + BOLA / 2 - (yPaleta + PALETA_H / 2)) / (PALETA_H / 2)));
  p.vx = signo * Math.min(Math.abs(p.vx) * 1.06, 13);
  p.vy = rel * 6;
  Sonido.tocar('paleta');
}

function punto(direccion) {
  if (p.pIzq >= META || p.pDer >= META) {
    p.fin = true;
    Sonido.tocar(!p.dos && p.pDer > p.pIzq ? 'pierde' : 'gana');
  } else {
    Sonido.tocar('punto');
    sacar(direccion);
  }
}

const paso = pasosFijos(() => {
  if (p.estado !== 'jugando' || p.pausa || p.fin) return;
  if (p.dos) {
    moverHumano('izq', ['w'], ['s'], mandos[0]);
    moverHumano('der', ['arrowup'], ['arrowdown'], mandos[1]);
  } else {
    moverHumano('izq', ['w', 'arrowup'], ['s', 'arrowdown'], mandos[0]);
    moverIA();
  }
  moverBola();
});

// --- controles ---
const $ = (id) => document.getElementById(id);
function empezar() {
  Sonido.iniciar();
  if (p.estado === 'inicio') { p.estado = 'jugando'; reiniciar(); }
}
function alternarPausa() {
  if (p.estado !== 'jugando' || p.fin) return;
  p.pausa = !p.pausa;
}
function cambiarModo() {
  p.dos = !p.dos;
  Guardado.escribir('pong_dos', p.dos);
  actualizarBotones();
  if (p.estado === 'jugando') reiniciar();
}
function cambiarNivel(n) {
  p.nivel = n || (p.nivel % 3) + 1;
  Guardado.escribir('pong_nivel', p.nivel);
  actualizarBotones();
}
function alternarSonido() {
  Sonido.iniciar();
  Sonido.alternar();
  actualizarBotones();
}
function actualizarBotones() {
  $('b-modo').textContent = p.dos ? '2 jugadores' : '1 jugador';
  $('b-nivel').textContent = DIFICULTAD[p.nivel][0];
  $('b-nivel').style.display = p.dos ? 'none' : '';
  $('b-sonido').textContent = Sonido.activo ? '🔊' : '🔇';
}
$('b-modo').addEventListener('click', () => { Sonido.iniciar(); cambiarModo(); });
$('b-nivel').addEventListener('click', () => { Sonido.iniciar(); cambiarNivel(); });
$('b-sonido').addEventListener('click', alternarSonido);
$('b-pausa').addEventListener('click', () => { Sonido.iniciar(); alternarPausa(); });
$('b-reiniciar').addEventListener('click', () => { Sonido.iniciar(); p.estado = 'jugando'; reiniciar(); });
actualizarBotones();

addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  teclas.add(k);
  if (e.repeat) return;
  if (p.estado === 'inicio') { empezar(); return; }
  if (k === ' ') alternarPausa();
  else if (k === 'r') { reiniciar(); }
  else if (k === 'm') alternarSonido();
  else if (k === 'j') cambiarModo();
  else if (['1', '2', '3'].includes(k)) cambiarNivel(Number(k));
});
addEventListener('keyup', (e) => teclas.delete(e.key.toLowerCase()));
addEventListener('blur', () => teclas.clear());

// --- pantalla: con el teléfono vertical la cancha se gira 90° (tu paleta queda abajo) ---
const lienzo = $('lienzo');
const tactil = lienzo.parentElement;
const g = lienzo.getContext('2d');
let vertical = false, WL = ANCHO, HL = ALTO; // medidas del dibujo en pantalla
function ajustar() {
  vertical = tactil.clientHeight > tactil.clientWidth * 1.15;
  [WL, HL] = vertical ? [ALTO, ANCHO] : [ANCHO, ALTO];
  const esc = Math.max(0.05, Math.min(tactil.clientWidth / WL, tactil.clientHeight / HL));
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  lienzo.style.width = Math.floor(WL * esc) + 'px';
  lienzo.style.height = Math.floor(HL * esc) + 'px';
  lienzo.width = Math.max(1, Math.round(WL * esc * dpr));
  lienzo.height = Math.max(1, Math.round(HL * esc * dpr));
}
new ResizeObserver(ajustar).observe(tactil);
ajustar();
const base = () => g.setTransform(lienzo.width / WL, 0, 0, lienzo.height / HL, 0, 0);
// posición de un dedo en la cancha (x a lo largo, y a lo ancho), esté girada o no
function aCancha(e) {
  const r = lienzo.getBoundingClientRect();
  const sx = (e.clientX - r.left) * WL / r.width, sy = (e.clientY - r.top) * HL / r.height;
  return vertical ? { x: ANCHO - sy, y: sx } : { x: sx, y: sy };
}

// dedos: en 1 jugador cualquier dedo mueve tu paleta; en 2 jugadores cada mitad mueve la suya
// se escucha toda la zona del juego, no solo el dibujo, para que el dedo no tape la paleta
tactil.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (p.estado === 'inicio') { empezar(); return; }
  if (p.fin) { reiniciar(); return; }
  if (p.pausa) { alternarPausa(); return; }
  const pos = aCancha(e);
  const lado = p.dos && pos.x > ANCHO / 2 ? 'der' : 'izq';
  dedos.set(e.pointerId, lado);
  objetivo[lado] = pos.y;
  try { tactil.setPointerCapture(e.pointerId); } catch { /* sin captura */ }
});
tactil.addEventListener('pointermove', (e) => {
  const lado = dedos.get(e.pointerId);
  if (lado) objetivo[lado] = aCancha(e).y;
});
const soltarDedo = (e) => {
  const lado = dedos.get(e.pointerId);
  dedos.delete(e.pointerId);
  if (lado && ![...dedos.values()].includes(lado)) objetivo[lado] = null;
};
tactil.addEventListener('pointerup', soltarDedo);
tactil.addEventListener('pointercancel', soltarDedo);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && p.estado === 'jugando' && !p.fin) p.pausa = true;
});

// --- dibujo ---
// en pantallas chicas el dibujo se reduce mucho: el texto se agranda para que siga legible
// los textos se escriben siempre derechos, en coordenadas de pantalla
function texto(txt, x, y, tam, tinta, negrita = false, girado = false) {
  const aumento = Math.max(1, 0.7 * WL / Math.max(1, lienzo.clientWidth));
  g.save();
  if (girado) { g.translate(x, y); g.rotate(Math.PI); x = 0; y = 0; } // para quien juega del otro lado
  g.font = `${negrita ? 'bold ' : ''}${Math.round(tam * aumento)}px ${LETRA}`;
  g.fillStyle = tinta;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(txt, x, y);
  g.restore();
}

function dibujar(dt) {
  base();
  g.fillStyle = '#101820';
  g.fillRect(0, 0, WL, HL);
  // la cancha se dibuja en sus propias coordenadas; con el teléfono vertical, girada 90°
  if (vertical) g.transform(0, -1, 1, 0, 0, ANCHO);
  g.fillStyle = '#2a3a4a';
  for (let y = 0; y < ALTO; y += 30) g.fillRect(ANCHO / 2 - 2, y, 4, 16);
  if (p.estado !== 'inicio') {
    g.fillStyle = AZUL;
    g.fillRect(20, p.yIzq, PALETA_W, PALETA_H);
    g.fillStyle = NARANJA;
    g.fillRect(ANCHO - 20 - PALETA_W, p.yDer, PALETA_W, PALETA_H);
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(p.bx + BOLA / 2, p.by + BOLA / 2, BOLA / 2, 0, Math.PI * 2);
    g.fill();
  }
  base();
  const cx = WL / 2, cy = HL / 2;
  if (p.estado === 'inicio') {
    texto('PONG', cx, cy - 60, 60, '#ffffff', true);
    texto('Toca para empezar', cx, cy + 10, 22, '#ffffff');
    texto(p.dos ? 'Cada jugador arrastra el dedo en su mitad' : (vertical ? 'Arrastra el dedo a los lados' : 'Arrastra el dedo arriba y abajo'),
      cx, cy + 50, 15, '#8899aa');
    return;
  }
  const yo = p.dos ? 'JUGADOR 1' : 'TÚ', rival = p.dos ? 'JUGADOR 2' : 'COMPUTADOR';
  const nivel = p.dos ? '' : `Dificultad: ${DIFICULTAD[p.nivel][0]}`;
  if (vertical) { // tu lado abajo, el rival arriba; el marcador junto a la línea central
    texto(String(p.pIzq), WL - 40, cy + 45, 36, AZUL, true);
    texto(String(p.pDer), WL - 40, cy - 45, 36, NARANJA, true, p.dos);
    texto(yo, cx, HL - 8, 12, AZUL);
    texto(rival, cx, 10, 12, NARANJA, false, p.dos);
    if (nivel) texto(nivel, 70, cy + 18, 10, '#8899aa');
  } else {
    texto(String(p.pIzq), cx - 60, 40, 36, AZUL, true);
    texto(String(p.pDer), cx + 60, 40, 36, NARANJA, true);
    texto(yo, 90, HL - 15, 12, AZUL);
    texto(rival, WL - 90, HL - 15, 12, NARANJA);
    if (nivel) texto(nivel, cx, HL - 15, 11, '#8899aa');
  }

  p.tAyuda -= dt;
  if (p.tAyuda > 0 && p.dos && !p.fin) {
    if (vertical) {
      texto('arrastra aquí', cx, HL * 0.75, 16, '#4fc3f799');
      texto('arrastra aquí', cx, HL * 0.25, 16, '#ff704399', false, true);
    } else {
      texto('← arrastra aquí', WL / 4, cy, 16, '#4fc3f799');
      texto('arrastra aquí →', WL * 3 / 4, cy, 16, '#ff704399');
    }
  }
  if (p.fin) {
    const gano = p.pIzq > p.pDer;
    const titulo = p.dos ? (gano ? '¡GANA JUGADOR 1!' : '¡GANA JUGADOR 2!') : (gano ? '¡GANASTE!' : 'GANÓ EL COMPUTADOR');
    g.fillStyle = 'rgba(5, 10, 16, 0.6)';
    g.fillRect(0, cy - 60, WL, 120);
    texto(titulo, cx, cy - 15, vertical ? 26 : 36, gano || p.dos ? '#a5d6a7' : '#ef9a9a', true);
    texto('Toca para jugar de nuevo', cx, cy + 30, 16, '#ffffff');
  } else if (p.pausa) {
    texto('PAUSA', cx, cy, 36, '#ffffff', true);
  }
}

// mando: Start o A empiezan; Start pausa; el movimiento se lee en cada paso del juego
let mandos = [];
function leerMandos() {
  mandos = Mandos.leer();
  for (const m of mandos) {
    if (p.estado === 'inicio') { if (m.recien.a || m.recien.start) empezar(); }
    else if (p.fin) { if (m.recien.a || m.recien.start) reiniciar(); }
    else if (m.recien.start) alternarPausa();
  }
  if (!p.dos) mandos = mandos.slice(0, 1);
}

bucle((dt) => { leerMandos(); paso(dt); dibujar(dt); });
window.juego = { p, reiniciar, objetivo, teclas, Sonido };
</script>
</body>
</html>
