<html lang="es">
<head>
<meta charset="utf-8">

<title>Estudio Generativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de conversación de 760px; cabecera fija arriba, compositor fijo abajo, respuestas sin burbuja como en un chat de lectura. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eaedf3;
  --ink: #14161d;
  --ink-2: #4b5161;
  --ink-3: #828898;
  --line: #dcdfe8;
  --accent: #2f4fd6;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7ff;
  --user: #e3e7f1;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --shadow: 0 1px 2px rgba(20, 24, 40, .05), 0 8px 28px rgba(20, 24, 40, .07);
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --prose: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1015; --surface: #161922; --surface-2: #1d212c; --ink: #e7e9f0; --ink-2: #a7acb9;
    --ink-3: #747b8b; --line: #272c38; --accent: #8fa1ff; --accent-ink: #0b1033; --accent-soft: #222a4f;
    --user: #222735; --danger: #ff8f84; --danger-soft: #3a1d1b;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1015; --surface: #161922; --surface-2: #1d212c; --ink: #e7e9f0; --ink-2: #a7acb9;
  --ink-3: #747b8b; --line: #272c38; --accent: #8fa1ff; --accent-ink: #0b1033; --accent-soft: #222a4f;
  --user: #222735; --danger: #ff8f84; --danger-soft: #3a1d1b;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 30px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Cabecera */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 10px; padding-block: 12px;
}
.sello { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.sello svg { width: 20px; height: 20px; }
.cabecera h1 { font-size: 1.02rem; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.cabecera p { margin: 0; font-size: .78rem; color: var(--ink-3); }
.cabecera .nueva {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); border-radius: 10px; padding: 7px 11px; font-size: .82rem; color: var(--ink-2);
}
.cabecera .nueva svg { width: 15px; height: 15px; }
.cabecera > div:nth-child(2) { margin-right: auto; min-width: 0; }
@media (max-width: 420px) { .cabecera p { display: none; } }
.clave { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.clave h2 { font-size: 1rem; margin: 0; }
.clave p { margin: 0; font-size: .86rem; color: var(--ink-2); }
.clave .fila-clave { display: flex; gap: 8px; flex-wrap: wrap; }
.clave input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; font: .9rem var(--mono); color: var(--ink); outline: none; }
.clave input:focus { border-color: var(--accent); }
.clave .primario { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.clave a { color: var(--accent); }

/* Mensajes */
.hilo { flex: 1; display: flex; flex-direction: column; gap: 22px; padding-block: 8px 24px; }
.aviso-cap { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; font-size: .88rem; color: var(--ink-2); }
.yo { align-self: flex-end; max-width: 86%; background: var(--user); border-radius: 18px 18px 6px 18px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ia { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ia-cab { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--ink-3); }
.ia-cab .marca { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.ia-cab .marca svg { width: 12px; height: 12px; }
.etiqueta-ejemplo { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; border: 1px solid var(--line); padding: 1px 7px; border-radius: 99px; }

.prosa { font-family: var(--prose); font-size: 1.07rem; line-height: 1.68; min-width: 0; overflow-wrap: anywhere; }
.prosa > :first-child { margin-top: 0; }
.prosa > :last-child { margin-bottom: 0; }
.prosa p { margin: 0 0 .85em; }
.prosa h2, .prosa h3, .prosa h4 { font-family: var(--ui); line-height: 1.25; margin: 1.1em 0 .45em; text-wrap: balance; }
.prosa h2 { font-size: 1.2rem; } .prosa h3 { font-size: 1.05rem; } .prosa h4 { font-size: .98rem; }
.prosa ul, .prosa ol { margin: 0 0 .85em; padding-left: 1.3em; }
.prosa li { margin: .2em 0; }
.prosa blockquote { margin: 0 0 .85em; padding-left: 14px; border-left: 3px solid var(--line); color: var(--ink-2); }
.prosa code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
.prosa pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.prosa pre code { background: none; padding: 0; font-size: .84rem; line-height: 1.55; }
.prosa a { color: var(--accent); }
.pensando { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: .92rem; }
.puntos { display: inline-flex; gap: 4px; }
.puntos i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: salto 1.1s infinite ease-in-out; }
.puntos i:nth-child(2) { animation-delay: .15s; } .puntos i:nth-child(3) { animation-delay: .3s; }
@keyframes salto { 0%, 70%, 100% { opacity: .3; transform: none; } 35% { opacity: 1; transform: translateY(-3px); } }

/* Tarjetas de imagen y sonido */
.medio { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.medio-pie { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--ink-3); }
.medio-pie .txt { margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-mini { border: 1px solid var(--line); background: var(--surface-2); border-radius: 9px; padding: 5px 10px; font-size: .78rem; color: var(--ink); white-space: nowrap; }
.btn-mini[disabled] { opacity: .55; cursor: progress; }
.lienzo { aspect-ratio: 8 / 5; max-width: 100%; background: var(--surface-2); position: relative; }
.lienzo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.espera { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-3); font-size: .86rem; overflow: hidden; }
.espera::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 20%, var(--surface) 50%, transparent 80%);
  opacity: .55; background-size: 200% 100%; animation: brillo 1.5s linear infinite;
}
@keyframes brillo { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.espera span { position: relative; }
.reproductor { display: flex; align-items: center; gap: 12px; padding: 14px 12px; position: relative; min-height: 84px; }
.play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.play[disabled] { opacity: .5; cursor: progress; }
.play svg { width: 20px; height: 20px; }
.onda { flex: 1; min-width: 0; }
.onda canvas { width: 100%; height: 44px; display: block; cursor: pointer; touch-action: none; }
.tiempos { display: flex; justify-content: space-between; font: .7rem var(--mono); color: var(--ink-3); margin-top: 3px; font-variant-numeric: tabular-nums; }
.barra { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 9px 0 7px; }
.barra i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .35s ease; }
.vel { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; font: .72rem var(--mono); padding: 2px 8px; color: var(--ink-2); }
.m-voz .tiempos { align-items: center; }
.pista { font-size: .76rem; color: var(--ink-3); padding: 0 12px 10px; line-height: 1.4; }
.titulo-son { font-size: .84rem; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.fallo { border: 1px solid var(--danger); background: var(--danger-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: .88rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fallo .btn-mini { margin-left: auto; }
.acciones-ia { display: flex; gap: 6px; }
.acciones-ia button { border: 0; background: none; color: var(--ink-3); font-size: .78rem; padding: 4px 6px; border-radius: 7px; }
.acciones-ia button:hover { background: var(--surface-2); color: var(--ink); }

/* Sugerencias */
.sugerencias { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.sugerencia { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: .86rem; color: var(--ink-2); line-height: 1.35; }
.sugerencia b { display: block; color: var(--ink); font-weight: 600; font-size: .8rem; margin-bottom: 2px; }
.sugerencia:hover { border-color: var(--ink-3); }

/* Compositor */
.compositor {
  position: sticky; bottom: 0; z-index: 5; background: linear-gradient(to bottom, transparent, var(--bg) 22px);
  padding-block: 18px max(12px, env(safe-area-inset-bottom, 0px));
}
.caja { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 10px 10px 8px 14px; }
.caja:focus-within { border-color: var(--accent); }
.caja textarea { width: 100%; border: 0; outline: none; background: transparent; resize: none; min-height: 26px; max-height: 180px; line-height: 1.45; font-size: 1rem; padding: 4px 0; display: block; }
.fila { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.interruptor {
  display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 99px; padding: 5px 10px; font-size: .8rem; color: var(--ink-3);
}
.interruptor svg { width: 14px; height: 14px; }
.interruptor[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.enviar { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.enviar[disabled] { opacity: .4; cursor: default; }
.enviar svg { width: 18px; height: 18px; }
.nota-pie { text-align: center; font-size: .72rem; color: var(--ink-3); margin-top: 7px; }

.brindis {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px);
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: .86rem;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20;
}
.brindis.visible { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <header class="cabecera">
    <div class="sello" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 15c2.5-5 5-5 7.5 0s5 5 10.5-5"/></svg></div>
    <div>
      <h1>Estudio Generativo</h1>
      <p>Respuestas con texto, voz, imagen y música</p>
    </div>
    <button class="nueva" id="btn-clave" type="button" title="Clave de API de Anthropic" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 9.8-9.8M17 6l3 3M14.5 8.5l2 2"/></svg>Clave
    </button>
    <button class="nueva" id="nueva" type="button" title="Empezar una conversación nueva" style="margin-left:8px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nueva
    </button>
  </header>

  <main class="hilo" id="hilo" aria-live="polite"></main>

  <div class="compositor">
    <form class="caja" id="form">
      <textarea id="entrada" rows="1" aria-label="Tu petición" placeholder="Pide lo que quieras: una historia, una explicación, una canción…" autocomplete="off"></textarea>
      <div class="fila">
        <button type="button" class="interruptor" id="sw-voz" aria-pressed="true" title="Leer cada respuesta en voz alta al terminar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>Voz</button>
        <button type="button" class="interruptor" id="sw-imagen" aria-pressed="true" title="Incluir una imagen en la respuesta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>Imagen</button>
        <button type="button" class="interruptor" id="sw-sonido" aria-pressed="true" title="Incluir música o sonido en la respuesta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>Sonido</button>
        <button type="submit" class="enviar" id="enviar" aria-label="Enviar" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="ico-enviar"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
    <div class="nota-pie">Responde Claude con tu cuenta. La voz, la imagen y la música se crean en tu dispositivo. Voz integrada: eSpeak/meSpeak (GPL).</div>
  </div>
</div>
<div class="brindis" id="brindis" role="status"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const MARCA = "@@MEDIA@@";
  const CLAVE = "estudio-generativo-v1";

  // ------------------------------------------------------------------ ejemplo
  const SVG_EJEMPLO = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'><defs><linearGradient id='c' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#0b1026'/><stop offset='.62' stop-color='#1e2b4b'/><stop offset='1' stop-color='#3a4c72'/></linearGradient><linearGradient id='m' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#1d2e4b'/><stop offset='1' stop-color='#060a14'/></linearGradient><radialGradient id='l' cx='.5' cy='.5' r='.5'><stop offset='0' stop-color='#ffe7a3' stop-opacity='.85'/><stop offset='1' stop-color='#ffe7a3' stop-opacity='0'/></radialGradient><linearGradient id='h1' x1='0' y1='0' x2='1' y2='0'><stop offset='0' stop-color='#fff1c2' stop-opacity='.5'/><stop offset='1' stop-color='#fff1c2' stop-opacity='0'/></linearGradient><linearGradient id='h2' x1='1' y1='0' x2='0' y2='0'><stop offset='0' stop-color='#fff1c2' stop-opacity='.35'/><stop offset='1' stop-color='#fff1c2' stop-opacity='0'/></linearGradient><pattern id='r' width='26' height='44' patternUnits='userSpaceOnUse' patternTransform='rotate(14)'><line x1='4' y1='0' x2='4' y2='17' stroke='#a9bce0' stroke-opacity='.32' stroke-width='1.2'/><line x1='17' y1='22' x2='17' y2='36' stroke='#a9bce0' stroke-opacity='.22' stroke-width='1'/></pattern></defs><rect width='800' height='500' fill='url(#c)'/><g fill='#0e1730' opacity='.85'><ellipse cx='140' cy='80' rx='200' ry='46'/><ellipse cx='500' cy='60' rx='270' ry='52'/><ellipse cx='740' cy='130' rx='170' ry='36'/><ellipse cx='300' cy='150' rx='180' ry='26'/></g><polygon points='560,190 800,110 800,262' fill='url(#h1)'/><polygon points='560,190 300,150 300,222' fill='url(#h2)'/><rect y='332' width='800' height='168' fill='url(#m)'/><g fill='none' stroke='#5a78a8' stroke-linecap='round'><path d='M0 362 Q50 348 100 362 T200 362 T300 362 T400 362 T500 362' stroke-opacity='.45' stroke-width='2'/><path d='M0 410 Q60 392 120 410 T240 410 T360 410 T480 410' stroke-opacity='.35' stroke-width='2.5'/><path d='M0 462 Q70 440 140 462 T280 462 T420 462' stroke-opacity='.3' stroke-width='3'/></g><rect x='544' y='336' width='32' height='130' fill='#ffe7a3' opacity='.1'/><path d='M460 500 L462 306 Q520 272 600 282 Q680 292 722 332 L800 344 L800 500 Z' fill='#090e1b'/><circle cx='560' cy='190' r='78' fill='url(#l)'/><polygon points='545,284 575,284 570,200 550,200' fill='#e8ecf4'/><polygon points='547,264 573,264 572,248 548,248' fill='#c4423a'/><polygon points='549,230 571,230 570.5,216 549.5,216' fill='#c4423a'/><rect x='548' y='180' width='24' height='20' rx='2' fill='#ffe7a3'/><polygon points='543,181 577,181 560,163' fill='#c4423a'/><rect x='541' y='198' width='38' height='4' fill='#2a3045'/><rect width='800' height='500' fill='url(#r)'/></svg>";
  const EJEMPLO = [
    { id: "ej1", role: "user", text: "Un faro solitario en una noche de tormenta", ejemplo: true },
    {
      id: "ej2", role: "assistant", ejemplo: true,
      text: "**El faro de la tormenta**\n\nLa lluvia cae de lado y el mar golpea las rocas, pero la luz del faro sigue girando, paciente, cada pocos segundos. Allá arriba nadie la ve encenderse; solo la ven los barcos que todavía no llegan.\n\nTe dejo el faro sobre el acantilado con su haz cortando la lluvia, y una pieza lenta de piano en *la menor* con la tormenta de fondo.",
      imagen: { alt: "Faro sobre un acantilado de noche, con su haz de luz atravesando la lluvia", svg: SVG_EJEMPLO },
      sonido: {

        ambiente: ["lluvia", "olas"], volumen_ambiente: 0.55, repeticiones: 1,
        acordes: [["Am", 4], ["F", 4], ["C", 4], ["G", 4], ["Am", 4], ["F", 4], ["Dm", 4], ["E", 4]],
        melodia: [["A4", 1.5], ["B4", .5], ["C5", 1], ["E5", 1], ["F5", 2], ["E5", 1], ["C5", 1], ["G4", 1.5], ["A4", .5], ["C5", 2],
          ["B4", 2], ["D5", 2], ["A4", 1.5], ["B4", .5], ["C5", 1], ["E5", 1], ["F5", 1], ["A5", 1], ["G5", 1], ["F5", 1],
          ["E5", 1], ["D5", 1], ["C5", 1], ["D5", 1], ["E5", 3], ["R", 1]],
      },
    },
  ];
  const SUGERENCIAS = [
    ["Cuento", "Un cuento corto de un dragón que le teme a la oscuridad"],
    ["Explicación", "¿Cómo se forma un volcán? Explícamelo fácil"],

      const frases = p.match(/[^.!?…]+[.!?…]+["»”)]*\s*|[^.!?…]+$/g) || [p];

      for (const f of frases) { if (buf && (buf + f).length > 220) { out.push(buf.trim()); buf = ""; } buf += f; }
      if (buf.trim()) out.push(buf.trim());
    }
    return out.slice(0, 200);
  }

  // Voz integrada: eSpeak en un Worker; devuelve un WAV por trozo.
  function vozIntegrada() {
    if (!VOZ.cargando) {
      VOZ.cargando = fetch("voz-espeak.js")
        .then((r) => { if (!r.ok) throw new Error("http " + r.status); return r.text(); })
        .then((codigo) => {
          const w = new Worker(URL.createObjectURL(new Blob([codigo], { type: "text/javascript" })));
          const pendientes = new Map(); let n = 0;
          w.onmessage = (e) => {
            const p = pendientes.get(e.data.id); if (!p) return;
            pendientes.delete(e.data.id);
            if (e.data.error || !e.data.wav) p.rej(new Error(e.data.error || "sin audio")); else p.res(e.data.wav);
          };
          w.onerror = () => { pendientes.forEach((p) => p.rej(new Error("motor"))); pendientes.clear(); };
          return (texto, vel, v) => new Promise((res, rej) => {
            const id = ++n; pendientes.set(id, { res, rej });
            w.postMessage({ id, texto, velocidad: Math.round(150 * vel), variante: v.variante, tono: v.tono });
          });
        });
      VOZ.cargando.catch(() => { VOZ.cargando = null; });
    }
    return VOZ.cargando;
  }

  function narrar(t) {
    detenerVoz();
    const trozos = trocear(textoHablado(t));
    if (!trozos.length) return;
    const s = { id: t.id, trozos, i: 0, vivo: true, perro: 0, motor: motorActual(), estado: "", saltar: null };
    VOZ.sesion = s;
    audios.forEach((o) => o.el && o.el.pause());
    if (t.sonido) obtenerAudio(t).then((a) => {
      if (!s.vivo) return;
      audioFondo.src = a.url; audioFondo.currentTime = 0; audioFondo.play().catch(() => {});
    }).catch(() => {});
    uiVoz();
    if (s.motor === "dispositivo") leerConDispositivo(s); else leerIntegrada(s);
  }

  function leerConDispositivo(s) {
    const decir = () => {
      if (!s.vivo) return;
      if (s.i >= s.trozos.length) { detenerVoz(); return; }
      const texto = s.trozos[s.i];
      const u = new SpeechSynthesisUtterance(texto);
      u.voice = VOZ.voz; u.lang = VOZ.voz.lang; u.rate = VOZ.vel;
      let hecho = false, empezo = false;
      const limite = Date.now() + (texto.length * 75) / VOZ.vel + 2000;
      const avanzar = () => { if (hecho || !s.vivo) return; hecho = true; clearTimeout(s.perro); s.i++; decir(); };
      u.onstart = () => { empezo = true; VOZ.dispositivoProbado = true; };
      u.onend = avanzar;
      u.onerror = (e) => {
        if (e.error === "interrupted" || e.error === "canceled") return;
        if (!empezo && !VOZ.dispositivoProbado) { hecho = true; pasarAIntegrada(s); } else avanzar();
      };
      // Si la voz del dispositivo no arranca, se cambia a la integrada; si no avisa
      // del final de un trozo, se detecta aquí.
      const revisar = () => {
        if (hecho || !s.vivo) return;
        if (!empezo && !VOZ.dispositivoProbado && !speechSynthesis.speaking) { hecho = true; pasarAIntegrada(s); return; }
        if (Date.now() > limite && !speechSynthesis.speaking) { avanzar(); return; }
        s.perro = setTimeout(revisar, 700);
      };
      s.perro = setTimeout(revisar, 2500);
      speechSynthesis.speak(u);
      uiVoz();
    };
    try { speechSynthesis.cancel(); } catch {}
    setTimeout(decir, 60);
  }

  function pasarAIntegrada(s) {
    clearTimeout(s.perro);
    try { speechSynthesis.cancel(); } catch {}
    VOZ.dispositivoFalla = true; s.motor = motorActual();
    leerIntegrada(s);
  }

  async function leerIntegrada(s) {
    s.estado = "Preparando la voz…"; uiVoz();
    let sintetizar;
    try { sintetizar = await vozIntegrada(); }
    catch { if (s.vivo) { detenerVoz(); aviso("No se pudo cargar la voz. Revisa tu conexión e inténtalo de nuevo."); } return; }
    const listos = new Map(), v = datosIntegrada(s.motor);
    const pedir = (i) => {
      if (i < s.trozos.length && !listos.has(i)) { const p = sintetizar(s.trozos[i], VOZ.vel, v).then(suavizar); p.catch(() => {}); listos.set(i, p); }
      return listos.get(i);
    };
    while (s.vivo && s.i < s.trozos.length) {
      let wavTrozo;
      try { wavTrozo = await pedir(s.i); } catch { s.i++; continue; }
      pedir(s.i + 1);
      if (!s.vivo) return;
      const url = URL.createObjectURL(wavTrozo);
      s.estado = ""; uiVoz();
      const fin = new Promise((res) => { audioVoz.onended = res; audioVoz.onerror = res; s.saltar = res; });
      audioVoz.src = url; audioVoz.playbackRate = 1;
      try { await audioVoz.play(); }
      catch {
        URL.revokeObjectURL(url);
        if (s.vivo) { detenerVoz(); aviso("Toca el botón de la voz para escuchar la respuesta"); }
        return;
      }
      await fin;
      URL.revokeObjectURL(url);
      if (!s.vivo) return;
      s.i++;
    }
    if (s.vivo) detenerVoz();
  }

  // Quita aspereza a eSpeak: menos agudos metálicos, algo de cuerpo y una sala pequeña.
  async function suavizar(buf) {
    try {
      const Ctx = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const audio = await new Promise((res, rej) => {
        const c = new Ctx(1, 1, 22050), p = c.decodeAudioData(buf.slice(0), res, rej);
        if (p && p.then) p.then(res, rej);
      });
      const sr = audio.sampleRate, ctx = new Ctx(2, audio.length + Math.floor(sr * .45), sr);
      const src = ctx.createBufferSource(); src.buffer = audio;
      const f = (tipo, frec, q, g) => { const n = ctx.createBiquadFilter(); n.type = tipo; n.frequency.value = frec; if (q) n.Q.value = q; if (g) n.gain.value = g; return n; };
      const hp = f("highpass", 110, .7), cuerpo = f("lowshelf", 260, 0, 2.5), dureza = f("peaking", 2900, 1.1, -5), lp = f("lowpass", 5000, .5);
      const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 2.5;
      src.connect(hp); hp.connect(cuerpo); cuerpo.connect(dureza); dureza.connect(lp); lp.connect(comp); comp.connect(ctx.destination);
      const sala = ctx.createConvolver(), ir = ctx.createBuffer(2, Math.floor(sr * .4), sr);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 4); }
      sala.buffer = ir; const humedo = ctx.createGain(); humedo.gain.value = .12;
      lp.connect(sala); sala.connect(humedo); humedo.connect(comp);
      src.start();
      const out = await ctx.startRendering();
      let pico = 1e-6;
      for (let c = 0; c < 2; c++) { const d = out.getChannelData(c); for (let i = 0; i < d.length; i++) pico = Math.max(pico, Math.abs(d[i])); }
      for (let c = 0; c < 2; c++) { const d = out.getChannelData(c), g = .9 / pico; for (let i = 0; i < d.length; i++) d[i] *= g; }
      return wav(out);
    } catch {
      return new Blob([buf], { type: "audio/wav" });
    }
  }

  function detenerVoz() {
    const s = VOZ.sesion;
    if (!s) return;
    s.vivo = false; clearTimeout(s.perro); VOZ.sesion = null;
    if (VOZ.ok) { try { speechSynthesis.cancel(); } catch {} }
    audioVoz.pause(); if (s.saltar) s.saltar();
    audioFondo.pause();
    uiVoz();
  }

  function uiVoz() {
    const s = VOZ.sesion;
    document.querySelectorAll(".m-voz").forEach((card) => {
      const activo = !!s && s.id === card.dataset.id, play = card.querySelector(".play");
      if (!play) return;
      play.innerHTML = activo ? ICO_STOP : ICO_VOZ;
      play.setAttribute("aria-label", activo ? "Detener la lectura" : "Escuchar la respuesta");
      card.querySelector(".barra i").style.width = activo ? Math.max(3, (s.i / s.trozos.length) * 100) + "%" : "0%";
      card.querySelector(".estado").textContent = activo
        ? (s.estado || `Leyendo ${Math.min(s.i + 1, s.trozos.length)} de ${s.trozos.length}`) : card.dataset.reposo;
      card.querySelector(".nombre-voz").textContent = nombreMotor();
      const pista = card.querySelector(".pista");
      if (pista) pista.hidden = hayDispositivo();
    });
  }

  function tarjetaVoz(t) {
    const m = el("div", "medio m-voz"); m.dataset.id = t.id;
    const trozos = trocear(textoHablado(t));
    const seg = Math.round(trozos.join(" ").split(/\s+/).length / 2.6);
    m.dataset.reposo = seg < 60 ? `Unos ${Math.max(5, Math.round(seg / 5) * 5)} s` : `Unos ${Math.round(seg / 60)} min`;

    play.onclick = () => (VOZ.sesion && VOZ.sesion.id === t.id ? detenerVoz() : narrar(t));
    const info = el("div", "onda");
    const vel = el("button", "vel", fmtVel(VOZ.vel)); vel.type = "button"; vel.title = "Velocidad de lectura";
    vel.onclick = () => {
      const op = [1, 1.25, 1.5, .85];

    };
    const fila = el("div", "tiempos"); const est = el("span", "estado"); est.textContent = m.dataset.reposo; fila.append(est, vel);
    info.append(el("div", "titulo-son", "Escuchar la respuesta"), el("div", "barra", "<i></i>"), fila);
    rep.append(play, info); m.append(rep);

    txt.append("Voz: "); const nv = el("span", "nombre-voz"); nv.textContent = nombreMotor(); txt.append(nv);
    if (t.sonido) txt.append(" · con su música de fondo");
    const cambiar = el("button", "btn-mini cambiar-voz", "Cambiar voz"); cambiar.type = "button";
    cambiar.onclick = () => {
      const ops = opcionesVoz();

    pista.hidden = hayDispositivo(); m.append(pista);
    if (VOZ.sesion && VOZ.sesion.id === t.id) requestAnimationFrame(uiVoz);
    return m;
  }

  // ------------------------------------------------------------------ Claude
  function reglas(pide) {
    return `Eres el motor de "Estudio Generativo", una app que responde a cualquier petición con texto y, cuando se pide, con una imagen y un sonido que acompañan la respuesta.

FORMATO OBLIGATORIO DE TU RESPUESTA:
1) La respuesta en Markdown, en el idioma del usuario (español por defecto). Responde de verdad a lo que pide: si es una pregunta, contéstala bien; si es una historia, escríbela. Sé claro y ve al grano; extiéndete solo si lo piden. Tu texto también se leerá en voz alta: escribe frases que suenen bien habladas y evita tablas y emojis salvo que los pidan. No uses imágenes Markdown ni HTML. No menciones este formato ni el JSON.
2) Después, sola en su línea: ${MARCA}
3) Después, un único objeto JSON (sin bloque de código): {"imagen": ..., "sonido": ...}

IMAGEN (${pide.imagen ? "OBLIGATORIA" : "pon null"}): {"alt": "descripción breve", "svg": "<svg ...>...</svg>"}
- Una ilustración SVG completa y bonita de lo que trata la respuesta: viewBox='0 0 800 500', fondo que cubra todo el lienzo, composición clara con primer plano y fondo, profundidad con capas y degradados (linearGradient/radialGradient), paleta armoniosa, formas limpias. Sin texto salvo que lo pidan.
- Para que el JSON sea válido: el SVG en UNA sola línea, atributos con comillas SIMPLES, sin comillas dobles ni barras invertidas dentro.
- Prohibido: <script>, <image>, <foreignObject>, enlaces externos, eventos on*. Máximo unos 7000 caracteres.

SONIDO (${pide.sonido ? "OBLIGATORIO" : "pon null"}): una pieza corta o un paisaje sonoro que acompañe la respuesta. Se sintetiza en el dispositivo a partir de este objeto:
{"titulo": "...", "tempo": 40-180, "instrumento": "piano|pulsado|flauta|cuerdas|metal|campana|sintetizador",
 "acordes": [["Am",4],["F",4],...], "melodia": [["E5",1],["R",0.5],...], "bajo": true|false,
 "bateria": "ninguna|suave|pop|rock|lofi|epica", "ambiente": ["lluvia"|"olas"|"viento"|"pajaros"|"fuego"|"grillos"|"cosmos"|"ciudad"] (0 a 2),
 "volumen_ambiente": 0-1, "repeticiones": 1-4, "duracion": segundos (solo si no hay música)}
- Compás de 4/4. Duraciones en tiempos (1 = negra). Acordes con nombres tipo C, Am, F#m7, Bbmaj7, G7, Dsus4. Notas de C3 a C6, "R" es silencio.
- La melodía debe encajar con los acordes y sumar los mismos tiempos (16 a 48 tiempos). Que sea cantable, con un motivo que se repite y termine en la tónica.
- Elige tempo, instrumento, batería y ambiente según el ánimo de la respuesta. Si piden solo un efecto o ambiente (lluvia, mar...), deja "acordes" y "melodia" vacíos y usa "ambiente" y "duracion".`;
  }

  function historial(hasta) {
    const turnos = estado.turnos.slice(0, hasta).filter((t) => !t.ejemplo && !t.error && t.text).slice(-12);
    return turnos.map((t) => {
      if (t.role === "user") return { role: "user", content: t.text.slice(0, 4000) };
      let c = t.text.slice(0, 4000);
      if (t.imagen) c += `\n\n[Se mostró una imagen: ${t.imagen.alt || "ilustración"}]`;
      if (t.sonido) c += `\n[Se reprodujo un sonido: ${t.sonido.titulo || "pieza"}]`;
      return { role: "assistant", content: c };
    });
  }

  function separar(texto) {
    const i = texto.indexOf(MARCA);
    if (i >= 0) return { cuerpo: texto.slice(0, i).trimEnd(), json: texto.slice(i + MARCA.length), hayMarca: true };
    // Oculta un comienzo de marca que aún se está escribiendo.
    for (let k = MARCA.length - 1; k > 0; k--) if (texto.endsWith(MARCA.slice(0, k))) return { cuerpo: texto.slice(0, -k), json: "", hayMarca: false };
    return { cuerpo: texto, json: "", hayMarca: false };
  }

  function leerJSON(s) {
    s = s.trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "");
    const a = s.indexOf("{"), b = s.lastIndexOf("}");
    if (a < 0 || b <= a) return null;
    const cuerpo = s.slice(a, b + 1);
    try { return JSON.parse(cuerpo); } catch {}
    try { return JSON.parse(cuerpo.replace(/[\r\n\t]+/g, " ")); } catch {}
    return null;
  }

  const COPIA_ERROR = {
    auth: "La clave de API no es válida o fue revocada. Toca «Clave» arriba para cambiarla.",
    sin_saldo: "Tu cuenta de la API no tiene saldo o alcanzó su límite de gasto. Revísalo en console.anthropic.com.",
    not_granted: "No se dio permiso para usar Claude en esta página. Vuelve a abrirla y acepta el permiso.",
    sampling_disabled: "Claude no está disponible para tu cuenta en esta página.",
    not_declared: "Esta página ya no tiene acceso a Claude.",
    capability_disabled: "Claude no está disponible en esta vista.",
    capability_removed: "Actualiza la app de Claude para usar esta página.",
    rate_limited: "Hiciste muchas peticiones seguidas o llegaste a tu límite de uso. Espera un momento y reintenta.",
    session_expired: "Tu sesión de Claude caducó. Vuelve a iniciar sesión y reintenta.",
    refused: "Claude no respondió a esta petición. Prueba a pedirlo de otra forma.",
    empty_completion: "La respuesta llegó vacía. Prueba a pedirlo de otra forma.",
    prompt_too_large: "La conversación es demasiado larga. Empieza una nueva con «Nueva».",
  };
  const PERMANENTES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];

  async function enviar(texto) {
    texto = (texto ?? $("entrada").value).trim();
    if (!texto || estado.ocupado) return;
    if (!estado.sample) {
      if (!EN_CLAUDE) { aviso("Primero guarda tu clave de API"); document.getElementById("campo-clave")?.focus(); }
      else aviso(estado.sample === null ? "Abre esta página en Claude para poder preguntar" : "Conectando con Claude… inténtalo en un momento");
      return;
    }
    detenerVoz();
    $("entrada").value = ""; ajustarAltura(); actualizarEnviar();
    const usuario = { id: nuevoId(), role: "user", text: texto };
    estado.turnos.push(usuario);
    await responder();
  }

  async function responder() {
    const pide = { imagen: $("sw-imagen").getAttribute("aria-pressed") === "true", sonido: $("sw-sonido").getAttribute("aria-pressed") === "true" };
    const t = { id: nuevoId(), role: "assistant", text: "", pendiente: true, pide };
    const entrada = [{ role: "user", content: reglas(pide) }, ...historial(estado.turnos.length)];
    estado.turnos.push(t);
    pintarTodo();
    const caja = document.querySelector(`[data-id="${t.id}"]`);
    caja.scrollIntoView({ block: "start", behavior: "smooth" });
    ocupar(true);
    const ctl = (estado.ctl = new AbortController());
    let bruto = "";
    try {
      const r = await estado.sample(entrada, {
        cache: false, signal: ctl.signal,
        onText: ({ text }) => {
          bruto = text;
          const p = separar(text);
          t.text = p.cuerpo; t.esperandoMedios = p.hayMarca && (pide.imagen || pide.sonido);
          actualizarIA(caja, t);
        },
      });
      bruto = r.text;
      const p = separar(bruto);
      t.text = p.cuerpo || "(Sin texto)";
      const medios = p.hayMarca ? leerJSON(p.json) : null;
      const faltan = [];
      if (pide.imagen) {
        const svg = medios && medios.imagen ? limpiarSVG(medios.imagen.svg) : null;
        if (svg) t.imagen = { alt: String(medios.imagen.alt || "").slice(0, 200), svg }; else faltan.push("la imagen");
      }
      if (pide.sonido) {
        const s = medios && medios.sonido;
        if (s && typeof s === "object" && ((s.melodia && s.melodia.length) || (s.acordes && s.acordes.length) || s.ambiente)) t.sonido = s; else faltan.push("el sonido");
      }
      if (faltan.length) t.notaMedios = `No llegó ${faltan.join(" ni ")} en buen estado${r.truncated ? " (la respuesta se cortó)" : ""}.`;
    } catch (e) {
      const code = e && e.code;
      t.text = e && e.text ? separar(e.text).cuerpo : t.text;
      if (code === "cancelled") { if (!t.text) t.text = "*Detenido.*"; }
      else {
        t.error = COPIA_ERROR[code] || "Se cortó la conexión con Claude. Puedes reintentar.";
        t.reintentar = !PERMANENTES.includes(code);
        if (PERMANENTES.includes(code)) { estado.sample = null; }
        if (code === "auth") estado.pedirClave = true;
      }
    } finally {
      delete t.pendiente; delete t.esperandoMedios;
      estado.ctl = null; ocupar(false);
      actualizarIA(caja, t);
      guardar();
      if (!t.error && !ctl.signal.aborted && t.text && $("sw-voz").getAttribute("aria-pressed") === "true") narrar(t);
      if (estado.pedirClave) { pintarTodo(); scrollTo({ top: 0, behavior: "smooth" }); }
    }
  }

  function reintentar(t) {
    if (estado.ocupado) return;
    detenerVoz();
    const i = estado.turnos.indexOf(t);
    if (i >= 0) estado.turnos.splice(i, 1);
    audios.delete(t.id);
    responder();
  }

  function ajustarAltura() { const a = $("entrada"); a.style.height = "auto"; a.style.height = Math.min(180, a.scrollHeight) + "px"; }

  // ------------------------------------------------------------------ modo API (fuera de claude.ai)
  // En GitHub Pages no existe la conexión de claude.ai: se usa la API de Anthropic
  // con la clave de la persona, guardada solo en este navegador.
  const SDK_URL = new URL("anthropic-sdk-0.131.0.js", location.href).href;  // SDK oficial, alojado junto a la página
  const MODELO = "claude-opus-5-5";
  const leerClave = () => { try { return localStorage.getItem("eg-clave-api") || ""; } catch { return ""; } };

  function samplePorAPI(clave) {
    let cliente = null;
    return async (entrada, op = {}) => {
      let texto = "";
      try {
        if (!cliente) {
          const { default: Anthropic } = await import(SDK_URL);
          estado.Anthropic = Anthropic;
          cliente = new Anthropic({ apiKey: clave, dangerouslyAllowBrowser: true });
        }
        // El primer turno son las reglas: van como system (y se cachean).
        const [reglasTurno, ...resto] = entrada;
        while (resto.length && resto[0].role !== "user") resto.shift();
        const stream = cliente.beta.messages.stream({
          model: MODELO,
          max_tokens: 64000,
          output_config: { effort: "medium" },
          system: [{ type: "text", text: reglasTurno.content, cache_control: { type: "ephemeral" } }],
          messages: resto,
          betas: ["server-side-fallback-2026-07-01"],
          fallbacks: "default",
        }, { signal: op.signal });
        stream.on("text", (delta) => { texto += delta; if (op.onText) op.onText({ text: texto, delta }); });
        const msg = await stream.finalMessage();
        if (msg.stop_reason === "refusal") throw { code: "refused", message: "refusal" };
        const final = msg.content.filter((b) => b.type === "text").map((b) => b.text).join("") || texto;
        if (!final.trim()) throw { code: "empty_completion", message: "sin texto" };
        return { text: final, truncated: msg.stop_reason === "max_tokens" };
      } catch (e) {
        if (e && e.code && typeof e.code === "string" && COPIA_ERROR[e.code] !== undefined) throw e;
        const A = estado.Anthropic;
        let code = "upstream_error";
        if (op.signal && op.signal.aborted) code = "cancelled";
        else if (A && e instanceof A.AuthenticationError) code = "auth";
        else if (A && e instanceof A.PermissionDeniedError) code = "auth";
        else if (A && e instanceof A.RateLimitError) code = "rate_limited";
        else if (A && e instanceof A.APIError && (e.status === 400 && /credit|balance|billing/i.test(String(e.message)))) code = "sin_saldo";
        else if (A && e instanceof A.APIError && e.status === 413) code = "prompt_too_large";
        throw { code, message: String((e && e.message) || e), text: texto || undefined };
      }
    };
  }

  function tarjetaClave() {
    const c = el("section", "clave");
    c.innerHTML = `<h2>Conecta tu clave de API</h2>
      <p>Fuera de claude.ai, la página responde con la API de Anthropic usando tu propia clave. Se guarda solo en este navegador y se envía únicamente a Anthropic. Cada respuesta se cobra en tu cuenta de la API (aparte de tu suscripción de Claude); crea una clave en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
      <div class="fila-clave"><input id="campo-clave" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." aria-label="Clave de API"><button type="button" class="primario" id="guardar-clave">Guardar</button></div>
      <p id="nota-clave"></p>`;
    const campo = c.querySelector("#campo-clave"), nota = c.querySelector("#nota-clave");
    if (leerClave()) { campo.value = leerClave(); nota.textContent = "Hay una clave guardada. Puedes reemplazarla o borrar el campo y guardar para quitarla."; }
    c.querySelector("#guardar-clave").onclick = () => {
      const v = campo.value.trim();
      if (v && !/^sk-ant-/.test(v)) { nota.textContent = "La clave debe empezar por sk-ant-. Cópiala completa desde la consola."; return; }
      try { if (v) localStorage.setItem("eg-clave-api", v); else localStorage.removeItem("eg-clave-api"); } catch {}
      estado.sample = v ? samplePorAPI(v) : null;
      estado.pedirClave = false;
      $("btn-clave").hidden = !v;
      aviso(v ? "Clave guardada. Ya puedes preguntar." : "Clave eliminada");
      pintarTodo();
      if (v) $("entrada").focus();
    };
    campo.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); c.querySelector("#guardar-clave").click(); } });
    return c;
  }
  $("btn-clave").addEventListener("click", () => { estado.pedirClave = true; pintarTodo(); scrollTo({ top: 0, behavior: "smooth" }); });

  pintarTodo();
  if (estado.turnos.length) requestAnimationFrame(() => scrollTo({ top: document.body.scrollHeight }));

  // Capacidades: la página funciona sin ellas y se activa cuando llegan.
  if (EN_CLAUDE) {
    const repintar = () => { if (!estado.ocupado) pintarTodo(); };
    window.claude.use("sample").then((s) => { estado.sample = s; if (!s) repintar(); }).catch(() => { estado.sample = null; repintar(); });
    window.claude.use("downloads").then((d) => { if (d) { estado.downloads = d; repintar(); } }).catch(() => {});
  } else {
    const clave = leerClave();
    estado.sample = clave ? samplePorAPI(clave) : null;
    $("btn-clave").hidden = !clave;
    pintarTodo();
  }
})();
</script>
